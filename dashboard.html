<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17171a">
  <meta name="description" content="本地多 Agent 额度悬浮看板">
  <title>Usage Watch</title>
  <link rel="stylesheet" href="/dashboard.css">
  <script src="/dashboard.js" defer></script>
</head>
<body>
  <main id="dashboard" class="watch" aria-label="多 Agent 额度看板" aria-busy="true">
    <header class="watch-head">
      <span class="watch-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <div class="watch-title">
        <strong>Usage</strong>
        <span>本机配额</span>
      </div>
      <div class="watch-actions" data-no-drag>
        <span id="overall_state" class="overall-state" role="status" aria-live="polite" aria-atomic="true">连接中</span>
        <button id="settings_toggle" class="settings-toggle" type="button" aria-controls="settings_panel" aria-expanded="false" aria-label="打开显示设置" title="显示设置">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M4 5h12M7 10h9M4 15h12" />
            <circle cx="6" cy="10" r="1.5" />
            <circle cx="13" cy="5" r="1.5" />
            <circle cx="11" cy="15" r="1.5" />
          </svg>
        </button>
      </div>
    </header>

    <section id="readouts" class="readouts" aria-label="Agent 额度"></section>
    <section id="empty_state" class="empty-state" hidden>
      <strong>尚未选择 Agent</strong>
      <span>打开配置，选择需要显示的额度。</span>
      <button id="empty_settings" type="button" data-no-drag>打开配置</button>
    </section>

    <aside id="settings_panel" class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings_title" aria-hidden="true" inert data-no-drag>
      <header class="settings-head">
        <div>
          <strong id="settings_title">显示与布局</strong>
          <span>选择要放在桌面的额度</span>
        </div>
        <button id="settings_close" class="icon-button" type="button" aria-label="关闭显示设置">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 6 8 8m0-8-8 8" /></svg>
        </button>
      </header>

      <fieldset class="settings-group">
        <legend>显示的 Agent</legend>
        <div id="agent_choices" class="agent-choices"></div>
      </fieldset>

      <fieldset class="settings-group">
        <legend>布局样式</legend>
        <div class="density-choices">
          <label><input type="radio" name="density" value="auto">自适应</label>
          <label><input type="radio" name="density" value="compact">紧凑</label>
          <label><input type="radio" name="density" value="comfortable">舒展</label>
          <label><input type="radio" name="density" value="strip">横向条</label>
          <label><input type="radio" name="density" value="strip-mini">极简条</label>
        </div>
      </fieldset>

      <fieldset class="settings-group">
        <legend>告警阈值</legend>
        <div class="alert-range">
          <label for="alert_percent">使用率达到 <output id="alert_percent_value" for="alert_percent">85%</output> 时提醒</label>
          <input id="alert_percent" type="range" min="50" max="95" step="1" value="85">
        </div>
      </fieldset>

      <fieldset class="settings-group">
        <legend>自动刷新桥接</legend>
        <div class="agent-choices bridge-choices">
          <label class="agent-choice bridge-choice"><span class="choice-copy"><strong>Kimi Code</strong><span>读取本机 Kimi 快照</span></span><input id="bridge_kimi" type="checkbox"></label>
          <label class="agent-choice bridge-choice"><span class="choice-copy"><strong>Grok</strong><span>读取本机 Grok 快照</span></span><input id="bridge_grok" type="checkbox"></label>
        </div>
      </fieldset>

      <footer class="settings-foot">
        <span id="settings_status" role="status" aria-live="polite">设置仅保存在本机</span>
        <button id="settings_reset" class="text-button" type="button">恢复默认</button>
      </footer>
    </aside>
  </main>
</body>
</html>
