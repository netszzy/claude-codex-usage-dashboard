<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#101316">
  <meta name="description" content="Local Claude, Codex, and Antigravity usage status">
  <title>Usage Watch</title>
  <link rel="stylesheet" href="/dashboard.css">
  <script src="/dashboard.js" defer></script>
</head>
<body>
  <main id="dashboard" class="watch" aria-label="Claude, Codex, and Antigravity usage" aria-live="polite" aria-busy="true">
    <header class="watch-head">
      <div>
        <strong>Usage watch</strong>
        <span>local quota monitor</span>
      </div>
      <span id="overall_state" class="overall-state">connecting</span>
    </header>

    <section class="readouts" aria-label="Usage services">
      <article id="card_claude" class="readout" aria-labelledby="label_claude">
        <header class="readout-head">
          <span id="label_claude" class="service-name claude"><i class="dot" aria-hidden="true"></i>Claude</span>
          <span id="state_claude" class="state">waiting</span>
        </header>
        <div class="quota-grid">
          <div class="quota"><span class="window-label">5H</span><strong id="value_claude_five" class="quota-value">--</strong></div>
          <div class="quota"><span class="window-label">7D</span><strong id="value_claude_seven" class="quota-value">--</strong></div>
        </div>
        <div class="reset-row"><span>reset</span><span id="reset_claude_five">no data</span><span id="reset_claude_seven">no data</span></div>
      </article>

      <article id="card_codex" class="readout" aria-labelledby="label_codex">
        <header class="readout-head">
          <span id="label_codex" class="service-name codex"><i class="dot" aria-hidden="true"></i>Codex</span>
          <span id="state_codex" class="state">waiting</span>
        </header>
        <div class="quota-grid">
          <div class="quota"><span class="window-label">5H</span><strong id="value_codex_five" class="quota-value">--</strong></div>
          <div class="quota"><span class="window-label">7D</span><strong id="value_codex_seven" class="quota-value">--</strong></div>
        </div>
        <div class="reset-row"><span>reset</span><span id="reset_codex_five">no data</span><span id="reset_codex_seven">no data</span></div>
      </article>

      <article id="card_antigravity" class="readout antigravity-card" aria-labelledby="label_antigravity">
        <header class="readout-head">
          <span id="label_antigravity" class="service-name antigravity"><i class="dot" aria-hidden="true"></i>Antigravity</span>
          <span id="state_antigravity" class="state">waiting</span>
        </header>
        <div class="group-row">
          <span id="label_antigravity_primary" class="group-label">active group</span>
          <span class="metric-pair"><span class="window-label">5H</span><strong id="value_antigravity_five" class="quota-value">--</strong><span class="window-label">7D</span><strong id="value_antigravity_seven" class="quota-value">--</strong></span>
        </div>
        <div id="antigravity_other" class="group-row" hidden>
          <span id="label_antigravity_other" class="group-label">other group</span>
          <span class="metric-pair"><span class="window-label">5H</span><strong id="value_antigravity_other_five" class="quota-value">--</strong><span class="window-label">7D</span><strong id="value_antigravity_other_seven" class="quota-value">--</strong></span>
        </div>
        <div class="reset-row"><span>reset</span><span id="reset_antigravity_five">no data</span><span id="reset_antigravity_seven">no data</span></div>
      </article>
    </section>
  </main>
</body>
</html>
